name: ci

# PR + push checks (§9). Any red blocks merge. Runs on Ubuntu; the same
# commands the owner runs locally on Windows (uv run ..., npm run build) are
# invoked here so both platforms exercise the identical entrypoints (§0.6).

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Sync (pinned Python 3.12 from .python-version)
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest (+ §8 100%-branch gate on the credibility-bearing modules)
        # One run: the full suite AND the coverage gate. §8 enforces 100% branch on
        # the small, pure, credibility-bearing modules; aggregate 100% over exactly
        # these targets ⟺ each at 100%. `term-missing` localizes any regression.
        # (Not in pytest addopts on purpose — a plain/subset `uv run pytest` stays
        # usable.) V2-4 (D68) adds scoring.py + classify.py to the metrics+rankings set;
        # V2-5 adds legislation_stats.py (the dashboard-headline source); V2-11 (D95)
        # adds events.py and topics.py, the two projections behind the published feed and
        # the topic pages — both pure and both re-derived by verify-recompute
        # (invariants 8 and 9).
        run: >
          uv run pytest -q
          --cov=ingest.metrics --cov=ingest.rankings
          --cov=ingest.scoring --cov=ingest.classify
          --cov=ingest.legislation_stats --cov=ingest.events --cov=ingest.topics
          --cov=ingest.ai --cov=ingest.pilot --cov=ingest.statements_crec
          --cov=ingest.prefilter --cov=ingest.statements_press --cov=ingest.press_render
          --cov-branch --cov-fail-under=100 --cov-report=term-missing
      - name: Verify-recompute (recompute-and-match over the dataset)
        run: uv run verify-recompute

  site-and-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Node 22 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Sync Python
        run: uv sync --frozen
      - name: Install site deps
        working-directory: site
        run: npm ci
      # Build BEFORE checks so §6.4 banned-words scans the real site/dist/**.
      - name: Astro build
        working-directory: site
        env:
          PUBLIC_BUILD_COMMIT: ${{ github.sha }}
        run: npm run build
      - name: Checks (banned-words, symmetry, integrity, ...)
        run: uv run checks
      - name: File-count gate (built files < Workers plan limit — H14)
        working-directory: site
        run: npm run test:file-count
      - name: Source-link trace (every vote/bill page cites its source_url)
        working-directory: site
        run: npm run test:links
      - name: Metrics-sections (methods page == metric-key set)
        working-directory: site
        run: npm run test:metrics-sections
      - name: Grade-labels (rendered grade labels ⊆ ratified config — §6.8)
        working-directory: site
        run: npm run test:grade-labels
      - name: Feed entry ids (no Atom entry id appears twice — SD-37)
        working-directory: site
        run: npm run test:feed-ids
      - name: Action rows (no action rendered twice; repeat note is the ratified one — SD-37)
        working-directory: site
        run: npm run test:action-rows
      - name: Install Playwright browser
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: E2E (axe a11y + 380px layout)
        working-directory: site
        run: npm run test:e2e
      - name: Lighthouse (mobile perf + a11y >= 90)
        working-directory: site
        run: npm run test:lighthouse
      # Keep the Lighthouse reports. `lhci` prints only the category score, and
      # nothing on a pass, so without these a fix to a page that sits on the
      # ~0 margin (fact 2: `/` and `/m/A000055/1`) can only be judged pass/fail —
      # which is re-running and hoping. `if: always()` because the reports matter
      # MOST on the run that failed the assertion.
      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-${{ github.run_id }}-${{ github.run_attempt }}
          path: site/.lighthouseci/
          if-no-files-found: warn
          retention-days: 30

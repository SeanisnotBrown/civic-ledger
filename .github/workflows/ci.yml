name: ci

# PR + push checks (§9). Any red blocks merge. Runs on Ubuntu; the same
# commands the owner runs locally on Windows (uv run ..., npm run build) are
# invoked here so both platforms exercise the identical entrypoints (§0.6).

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (pinned Python 3.12 from .python-version)
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest (+ §8 100%-branch gate on metrics + rankings)
        # One run: the full suite AND the coverage gate. §8 enforces 100% branch on
        # the small, pure, credibility-bearing modules; aggregate 100% over exactly
        # these two targets ⟺ each at 100%. `term-missing` localizes any regression.
        # (Not in pytest addopts on purpose — a plain/subset `uv run pytest` stays
        # usable; classify.py joins at V2-4 with scoring.py, D68.)
        run: >
          uv run pytest -q
          --cov=ingest.metrics --cov=ingest.rankings
          --cov-branch --cov-fail-under=100 --cov-report=term-missing
      - name: Verify-recompute (recompute-and-match over the dataset)
        run: uv run verify-recompute

  site-and-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync Python
        run: uv sync --frozen
      - name: Install site deps
        working-directory: site
        run: npm ci
      # Build BEFORE checks so §6.4 banned-words scans the real site/dist/**.
      - name: Astro build
        working-directory: site
        env:
          PUBLIC_BUILD_COMMIT: ${{ github.sha }}
        run: npm run build
      - name: Checks (banned-words, no-llm, ...)
        run: uv run checks
      - name: File-count gate (built files < Workers plan limit — H14)
        working-directory: site
        run: npm run test:file-count
      - name: Source-link trace (every vote/bill page cites its source_url)
        working-directory: site
        run: npm run test:links
      - name: Metrics-sections (methods page == metric-key set)
        working-directory: site
        run: npm run test:metrics-sections
      - name: Install Playwright browser
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: E2E (axe a11y + 380px layout)
        working-directory: site
        run: npm run test:e2e
      - name: Lighthouse (mobile perf + a11y >= 90)
        working-directory: site
        run: npm run test:lighthouse

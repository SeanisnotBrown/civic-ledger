name: nightly

# INC-9 — unattended data refresh (§7 INC-9, §9). Incremental ingest of the
# current record → classify → export → build → checks → commit the data diff →
# push. The push triggers Cloudflare Workers Builds (H4, static-assets Worker via
# site/wrangler.jsonc), which is the deploy; this workflow holds NO Cloudflare
# secrets. On any check failure the job exits nonzero WITHOUT committing, so the
# last good deploy stays live (§6.1).
#
# The ingest is polite (§0.7): finalized rolls are skipped (ingest/incremental.py),
# so a normal night fetches only new/recent rolls. `workflow_dispatch` allows a
# manual rehearsal of the whole path.

on:
  schedule:
    - cron: "15 09 * * *" # 09:15 UTC daily
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: write # the job commits the data diff and pushes (fast-forward, never --force)

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so `uv run corrections` sees every correction: commit
      - name: Node 22 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Sync Python
        run: uv sync --frozen
      - name: Install site deps
        working-directory: site
        run: npm ci

      # R-5/M-7 — persist the raw API cache (data/raw/, gitignored) across nightly
      # runs. The ephemeral runner otherwise re-fetches every list/menu page, every
      # recent roll, and each member's full legislation pagination at 1 req/s. The key
      # is unique per run (so every night SAVES a fresh cache) while restore-keys
      # restores the most recent prior cache; staleness is not a concern because the
      # cache layer's own 20h TTL (ingest/cache.py) re-fetches anything too old. Effect:
      # a quiet night makes ~a dozen live requests instead of hundreds.
      - name: Restore raw API cache
        uses: actions/cache@v6
        with:
          path: data/raw
          key: nightly-raw-${{ github.run_id }}
          restore-keys: |
            nightly-raw-

      - name: Ingest, classify, export, build, checks — commit only on real change
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: |
          set -euo pipefail

          # 1) Roster refresh FIRST (R-2/D46): the covered-member set drives vote
          #    coverage and the unknown-member alarms, so a mid-Congress delegation
          #    change (special election, death, resignation) must land before the
          #    vote ingests read it. Idempotent + keyless (congress-legislators on
          #    GitHub); a quiet night rewrites data/members/*.json byte-identically.
          uv run ingest members

          #    Committee seats come from the same project and change with the roster
          #    (a resignation vacates a seat), so they refresh right behind it. The
          #    member page labels the section as CURRENT assignments, which is only
          #    true if it is re-pulled nightly (rule 0). Keyless, idempotent.
          uv run ingest committees

          #    Then the incremental ingest (finalized rolls skipped). Bills +
          #    legislation derive from votes/members; both fetch their sub-resources
          #    every run so a re-export never reverts enriched data to a None sentinel.
          uv run ingest house-votes
          uv run ingest senate-votes
          uv run ingest bills

          # 1b) BILL-ACTIVITY DELTA (V2-11 task 8). SD-33 decision 6 = a DAILY DIGEST
          #    carried by this nightly; there is deliberately no second intra-day
          #    workflow, so this one call is the whole steady-state refresh for the
          #    ~38,756 covered bills that `ingest bills` never sees (it only walks the
          #    ~1,000 that reached a roll call). Enumerates bills whose updateDate moved
          #    in the window and fetches ONLY /actions for a bill we already hold
          #    (merge_activity carries every other field through); the full four requests
          #    are paid only by a genuinely new bill. That is SD-33 cost constraint 2 and
          #    the difference between ~5-7 min/night and ~19-29 (D88 (7)).
          #
          #    WHY 30 h, stated explicitly rather than left to the code default: the cron
          #    is 24 h, so 30 h carries ~6 h of slack for a late start, a retried run or a
          #    workflow_dispatch rehearsal, and re-seeing a bill is idempotent (D90). 48 h
          #    was considered and REJECTED on cost: D88 measured 280-435 covered bills
          #    updated per day, so 30 h is ~350-545 bills (~6-9 min/night, ~180-270
          #    min/month) on top of the D86 nightly's ~900-1,400, and doubling the window
          #    would put the month against the 2,000-minute free allowance (H24).
          #
          #    WHY HERE, after `ingest bills` and before `ingest legislation`:
          #      * after bills, so a newly-voted bill exists before the delta refreshes it,
          #        and so the /actions responses `ingest bills` just fetched for the voted
          #        bills are served from the raw cache (zero extra requests for them);
          #      * before legislation, so the Sunday `--full` re-page (~3.5 h) does not
          #        shift this step's wall-clock from night to night - consecutive runs of
          #        this step stay ~24 h apart, which is what makes a 30 h window a real
          #        guarantee rather than an average;
          #      * before steps 3e/3f, which PROJECT data/bills into data/events and
          #        data/topics (verify-recompute invariants 8 and 9).
          #
          #    FAILURE SIGNAL (D87's lesson, and the accepted-quarantine.yaml header):
          #    a handful of transient per-bill fetch failures does NOT fail this run.
          #    `run_activity` prints them and returns 0 while they stay under
          #    config.ACTIVITY_FETCH_FAILURE ceilings; a systemic failure (a dead key, a
          #    bad window, the quarantine ceiling) still returns nonzero and `set -e`
          #    stops the night here. A failed bill simply keeps the record it already has
          #    - nothing false publishes, and the projections below re-derive from disk.
          #
          #    RAMP-UP, for whoever reads the first week's logs: the ~5-7 min/night figure
          #    assumes we already HOLD the updated bills. Congress 119 has not been
          #    backfilled, so most of the ~411 119th-Congress bills in a nightly window
          #    are genuinely new and pay the full four requests (~20-30 min/night) until
          #    the active set is held. That decays on its own; the local `--congress 119`
          #    backfill is what ends it outright, at zero Actions minutes.
          #
          #    OPERATIONAL NOTE: with ~427 covered bills updated per day, data/bills will
          #    change almost every night, so the step-2 classify gate fires nightly and
          #    the step-4 "quiet night" branch is now rare. A commit and a Workers Builds
          #    deploy per day IS the SD-33 cadence, not a regression.
          uv run ingest bill-activity --since 30

          #    Legislation (D86): ONE /member/{id} request per member probes the
          #    lifetime sponsored/cosponsored counts; only members whose counts moved
          #    get their lists re-paged. A full re-page of all 639 members is ~3.5 h of
          #    ~7 s pages and is what exhausted the free Actions minutes in 2026-09.
          #    Sundays (date +%u = 7) pass --full so an already-listed bill whose latest
          #    action moved to "Became Public Law" (invisible to the count probe) is
          #    never more than 7 days stale.
          if [ "$(date -u +%u)" = "7" ]; then
            uv run ingest legislation --full
          else
            uv run ingest legislation
          fi

          #    Mississippi state layer (INC-12/D55): hash-gated — one getDatasetList
          #    call; if the session's dataset_hash matches the committed manifest,
          #    nothing is fetched or rewritten (a sine_die session is a near-always
          #    no-op, and the manifest wall-clock is untouched so it can't false-trip
          #    the diff-gate). A new/changed session re-ingests data/state/ms/.
          uv run ingest ms

          # 2) Re-fetching a recent roll re-exports it as provisional `unclassified`
          #    (D24). If any vote data moved, re-classify to restore/assign vote_class.
          if [ -n "$(git status --porcelain data/votes data/absences data/bills)" ]; then
            uv run ingest classify
          fi

          # 3) Corrections ledger from git history (full checkout above).
          uv run corrections

          # 3b) Metrics are DERIVED data: recompute after classify + corrections but
          #     BEFORE the diff-gate, unconditionally — a legislation-only change
          #     (a new cosponsorship, a real event) must still reach the gate. A
          #     truly-quiet night regenerates metrics.json byte-identically (D33).
          uv run ingest metrics

          # 3c) Rankings (V2-2) are derived from metrics.json — regenerate right after
          #     metrics, still before the diff-gate, so a change that moves a rank
          #     (any member's metric changing) reaches the gate and gets committed.
          uv run ingest rankings

          # 3d) Grades (V2-4) are derived from metrics.json + the ratified
          #     data/config/thresholds.yaml — regenerate after metrics, before the
          #     diff-gate, so a change that moves a grade reaches the gate. Reads only
          #     committed config; no owner ratification happens here (that is H15).
          uv run ingest grades

          # 3e) The activity feed (V2-11 task 5) is DERIVED from data/bills + data/votes
          #     — regenerate it here, after everything that can move a bill and still
          #     before the diff-gate, so a new official action reaches the gate and gets
          #     committed. This is NOT optional: `ingest bills` refreshes each exported
          #     bill's /actions timeline every run (D90), so skipping this step would
          #     leave data/events/ stale and fail verify-recompute invariant 8 on the
          #     very next push. Pure projection: no network, no clock, ~0 Actions minutes.
          uv run ingest events

          # 3f) The topic index (V2-11 task 6) is DERIVED from data/bills — same
          #     reasoning and the same non-optionality as 3e: a stale index fails
          #     verify-recompute invariant 9 on the next push. Offline, no clock.
          uv run ingest topics

          # 4) Real change? (manifest isn't regenerated yet, so it can't false-trigger.)
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "No data change tonight — running checks for upstream drift, then exiting."
            uv run export            # refresh manifest/schemas locally (not committed)
            (cd site && npm run build)
            uv run checks
            uv run verify-recompute
            echo "nightly: quiet night, nothing to commit."
            exit 0
          fi

          # 5) Data changed → validate the FULL dataset before publishing anything.
          uv run export
          (cd site && npm run build)   # banned-words (checks) scans the real dist
          (cd site && npm run test:file-count)  # V2-1/H14: stay under the Workers file limit
          uv run checks
          uv run verify-recompute

          # 6) All gates green → commit the data diff and push (Cloudflare deploys on push).
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git commit -m "data: nightly $(date -u +%Y-%m-%d)"

          # 7) PUSH-COLLISION GUARD (D84). Steps 1-5 above ran for HOURS between
          #    this job's checkout and this push (4h18m..5h52m observed before D86;
          #    ~15-45 min after, except the Sunday --full night). Any commit
          #    landing on master inside that window makes a bare `git push`
          #    non-fast-forward and throws away a fully-green night's data: that is
          #    exactly how runs 35622111686 (2026-09-21) and 35872806073
          #    (2026-09-23) died, both AFTER every gate had passed. Rebase our one
          #    data commit onto the current tip and retry. NEVER --force: a rejected
          #    push means someone else's work is on the remote, and the data commit
          #    only ever touches data/, which nothing else writes, so the rebase is
          #    a clean replay. A genuine conflict fails the job loudly (the runner is
          #    ephemeral and the last good deploy stays live, same as today).
          #    Code-vs-data skew (a formula change landing mid-run, making the rebased
          #    data stale) is caught by ci.yml, which runs verify-recompute on push.
          for attempt in 1 2 3; do
            git fetch origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              echo "nightly: committed and pushed the data diff (attempt $attempt)."
              exit 0
            fi
            echo "nightly: push rejected on attempt $attempt; refetching." >&2
            sleep 15
          done
          echo "nightly: push failed after 3 attempts — data NOT published." >&2
          exit 1

# data/config/ai.yaml — mechanical AI configuration (§5 Phase 3 task 1).
#
# What this file is: the model, prompt version, effort, token ceiling, output shape and
# spend cap for every AI call the project makes. `ingest/ai.py` is the ONE module that
# reads it, and the one module every AI call goes through.
#
# What this file is NOT: evaluative. Nothing here decides what counts as a good or poor
# statement, what "priority" means, or what precision is good enough — those are Q-J
# (ratified 2026-10-09, §2) and Q-K (ratified 2026-10-23, recorded in thresholds.yaml
# under `categorizer_precision`), never here. This file is mechanical in the same sense as ingest/config.py.
#
# THERE IS NO `temperature`. The current models reject sampling parameters with a 400;
# `effort` (low | medium | high | xhigh | max) is the knob, and the spec's task-1 line was
# amended on 2026-10-09 to say so. Thinking is adaptive and always on for Opus 5.5 — it is
# not configured here and must not be disabled.
#
# Prompt TEXT is not in this file. It lives in the `prompt_file` below, and `prompt_sha256`
# pins that file's exact bytes, so "prompt version v1" is a claim anyone can check
# (tests/test_ai.py::test_prompt_files_match_their_recorded_hash enforces it). Change a
# prompt and you must bump `prompt_version` and re-record the hash in the same commit.

# Bumped whenever any value in this file changes, so a logged call states which
# configuration produced it. Not bumped by a comment edit.
config_version: 5

# --- Spend ---------------------------------------------------------------------------
# Hard per-run ceiling in USD (owner decision 5, 2026-10-09). `ingest/ai.py` refuses the
# next call once a run's actual spend reaches this; the run STOPS, it does not finish the
# batch. Cache hits cost nothing and never count against it.
per_run_cost_cap_usd: 5.00

# Owner decision 7, 2026-10-09. On a run, only this many of each member's NEWEST statements
# reach the categorizer; the rest stay cached, filtered and countable but uncategorized for
# a later run. It bounds the first spend AND keeps it per-member even, so a prolific press
# office cannot consume the run at the expense of a quiet one — which is also what keeps the
# §6 symmetry check meaningful on the first pass.
max_statements_per_member_per_run: 25

# Price per 1,000,000 tokens, USD, standard (non-batch) processing. Verified against
# platform.claude.com/docs/en/about-claude/models/overview.md on 2026-10-09. These exist
# here, not hardcoded, so a price change is a reviewable one-line diff — and so the
# count-before-spend report (owner decision 4) estimates from the same numbers the cap
# enforces. Billed output includes the model's own thinking tokens.
prices:
  claude-opus-5-5:
    input: 4.00
    output: 20.00
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
  claude-haiku-5-5:
    input: 0.10
    output: 0.50

# --- Tasks ---------------------------------------------------------------------------
tasks:

  # Owner decision 3, 2026-10-09: the cheap gate. One question per statement that survived
  # the free rule-based pre-filter; only a `true` reaches the categorizer below. At
  # $0.10/$0.50 per MTok this screens ~40x cheaper than asking Opus the same thing.
  triage_statement:
    model: claude-haiku-5-5
    # v1 (2026-10-22 overnight): the first real prompt, worded like the owner's labeling
    # sheet. Keeps the v1-stub ruling of 2026-10-22: office logistics is no longer a reject
    # category; nothing is false for its category alone. Step 9's first pass ran on
    # v1-stub; its verdicts stay in data/raw/triage/v1-stub.jsonl.
    # v2 (2026-10-23): owner ruling R2 only — grant and funding announcements,
    # commemorative or recognition resolutions, ceremonies, event appearances and check
    # presentations take no position unless the text also argues for or against a specific
    # policy change; credit-claiming for a past vote is not a position by itself. Worded
    # identically in categorize_statement v3. Unmeasured (R3: a fresh held-out 60).
    prompt_version: v2
    prompt_file: ingest/prompts/triage_statement/v2.md
    prompt_sha256: 6191a0245185c95e6b76ec1b6ad1a11aabafe108b26748ce4dd2f87ab796cabd
    effort: medium
    max_tokens: 1024
    output_schema:
      type: object
      additionalProperties: false
      required: [takes_policy_position]
      properties:
        takes_policy_position:
          type: boolean
          description: >-
            True only if the text takes a position on an identifiable policy. Judge what
            the text says, not its category: a funding, event or office notice is true
            only if it states such a position. Ceremonial text, procedural remarks and pure
            messaging with no position are false.

  # The categorizer. Model and effort are the owner's choice of 2026-10-09; Sonnet 5.5 at
  # effort `high` is the fallback candidate for the task-4 bake-off, scored on the same
  # held-out set. Reference input (NOT ratified):
  # docs/research/2026-10-09-categorizer-model-review.md
  #
  # v2 (2026-10-23): owner ruling 3 — announcing an act already done ("Today I introduced
  # a bill...") is not a priority signal; only a future pledge (Q-J b) or explicit ranking
  # (Q-J a) counts. Otherwise as v1. Settled by the owner: the stance values and
  # `proposition` (2026-10-09); priority_signal = Q-J (2026-10-09) + ruling 3; topic = the
  # 33 official policy areas, specificity = 3 levels, proposition reference-only and not
  # scored (2026-10-22); the confidence definitions and topic hints KEPT (2026-10-23).
  # Q-K ratified 2026-10-23; v2 is unmeasured, so nothing categorized with it publishes
  # until it clears the bar on the held-out set (curation/review.py::publish_gate).
  # v2 measured 2026-10-23 on the original 60: FAIL on topic and the D/R gap
  # (docs/research/2026-10-23-prompt-eval-60-owner-reviewed.md).
  #
  # v3 (2026-10-23): owner ruling R2 only — the no-position rule, worded identically in
  # triage_statement v2. Otherwise as v2. Unmeasured: R3 says the original 60 are spent for
  # any changed prompt, so v3 is measured on a fresh held-out 60 (p3-labeling-set-2).
  categorize_statement:
    model: claude-opus-5-5
    prompt_version: v3
    prompt_file: ingest/prompts/categorize_statement/v3.md
    prompt_sha256: 6423d845ee2164fdb218b1459faad4ff278284ec5a4111b656affe805a5a6716
    effort: medium
    # 4,096 must hold the model's thinking AND the JSON. Raise only if evaluation shows
    # real truncation (task 4).
    max_tokens: 4096
    output_schema:
      type: object
      additionalProperties: false
      required: [topic, stance, proposition, specificity, priority_signal, confidence]
      properties:
        topic:
          description: >-
            One of the 33 official policy areas (owner ruling 2026-10-22), copied exactly.
            Null when stance is `none`.
          anyOf:
            - type: string
              enum:
                - "Agriculture and Food"
                - "Animals"
                - "Armed Forces and National Security"
                - "Arts, Culture, Religion"
                - "Civil Rights and Liberties, Minority Issues"
                - "Commerce"
                - "Congress"
                - "Crime and Law Enforcement"
                - "Economics and Public Finance"
                - "Education"
                - "Emergency Management"
                - "Energy"
                - "Environmental Protection"
                - "Families"
                - "Finance and Financial Sector"
                - "Foreign Trade and International Finance"
                - "Government Operations and Politics"
                - "Health"
                - "Housing and Community Development"
                - "Immigration"
                - "International Affairs"
                - "Labor and Employment"
                - "Law"
                - "Native Americans"
                - "Private Legislation"
                - "Public Lands and Natural Resources"
                - "Science, Technology, Communications"
                - "Social Sciences and History"
                - "Social Welfare"
                - "Sports and Recreation"
                - "Taxation"
                - "Transportation and Public Works"
                - "Water Resources Development"
            - type: "null"
        stance:
          type: string
          enum: [for, against, mixed, none]
          description: >-
            Owner decision, 2026-10-09. `none` = the text takes no position on an
            identifiable policy. `mixed` = the text expresses genuinely COMPETING
            positions; it NEVER means "unclear" — an unclear statement is `none` and goes
            to a human.
        proposition:
          type: [string, "null"]
          description: >-
            Owner decision, 2026-10-09. What the stance is about, in one clause, drawn from
            the text itself. "Against" on a topic is too broad to be checkable; opposing a
            particular restriction is not opposing the topic. Null when stance is `none`.
        specificity:
          description: >-
            Owner ruling 2026-10-22. 1 = names a specific bill, rule, program or number;
            2 = names a concrete change but nothing specific; 3 = names only the issue.
            Null when stance is `none`.
          anyOf:
            - type: integer
              enum: [1, 2, 3]
            - type: "null"
        priority_signal:
          type: boolean
          description: >-
            Q-J (ratified 2026-10-09): true only when the text explicitly ranks the issue or
            makes a concrete commitment to introduce, pass or block a specific thing. An act
            already done ("today I introduced...") is not a pledge (owner, 2026-10-23). One
            statement never establishes a member's actual priorities; the per-member rule
            does.
        confidence:
          type: string
          enum: [high, medium, low]
          description: >-
            The model's own assessment that every substantive label above is supported by
            the supplied text. It is a prediction, not a measurement, and is displayed as
            model self-assessment. Its reliability is measured against the owner's labels
            (Q-K). The prompt's definitions were kept by the owner, 2026-10-23.

purpose: URL list for statement collectors (a) member press pages and (c) campaign issue pages — IMPLEMENTATIONv3.md
  §5 Phase 3 task 2. Owner-maintained.
drafted: '2026-10-13'
drafted_by: builder, at the owner's request; every guessed field is flagged
scope: the 40 members drawn by owner decision 10 (data/config/statement-pilot.yaml)
provenance:
  official_site: the roster's own terms[-1].url (legislators-current.yaml, snapshot 2026-10-09T19:53:23Z)
    — source-backed, not a guess
  rss: the roster's own terms[-1].rss_url where it has one — source-backed
  press_page: 'GUESS: official_site + one of the usual press paths, kept only when a live GET returned
    200. press_page_source records how it was found. A 200 proves the page exists, NOT that it is the
    member''s press release index. The three rows that did not resolve on 2026-10-13 (DeSaulnier, Moolenaar,
    Westerman) were supplied by the owner and verified 200 with this project''s own User-Agent: they
    live at /media-center/press-releases, a path the draft''s candidate list did not try. No 403, no
    bot block, no difference between the project UA and a browser UA — so a future draft should try
    /media-center/press-releases too.'
  campaign_site / campaign_issues_page: 'copilot-authored, not reviewed by Sean (2026-11-04, copilot
    call under the owner''s ground rules of that date). Researched from public sources: each site was
    confirmed by its own paid-for-by line, read live or from a Wayback capture where the live site
    answers 403 (the row''s comment says so). A null means none was found with confidence, and its
    comment says why. No official dataset carries a campaign domain, so every row carries
    campaign_source, and collector (c) refuses a URL without it. campaign_cycle is the run the page
    belongs to. campaign_issue_pages names the sub-pages of a list that shares no name with them.'
  owner_checked: false on every row until a human verifies it. Collector (a) must refuse a row that
    still says false. It records the owner's check of the PRESS page and says nothing about a campaign
    URL, so collector (c) reads campaign_source instead (2026-11-04).
  press_sitemap: 'owner-set, optional, 2026-10-15. Sitemap URLs on the member''s OWN host that
    list press releases, for a row whose list page cannot be paged. The sitemap supplies URLS
    ONLY. Its lastmod is when a page was last edited, so it is used once as a skip filter — a page
    edited before 2023-01-03 cannot have been published inside the window — and is NEVER stored as
    a statement''s date; every date comes from the release page''s own publication marker. Set on
    K000377 alone. press_sitemap_source records the ratification.'
  no_press_source: 'owner-set, 2026-10-14. The member publishes no press-release list at all, so
    there is nothing to collect and nothing to fix. no_press_reason and no_press_urls_tried record
    what was looked for. A row carrying this must report as "no list exists", never as empty or
    failed. Read by statements_press.sources(), which tests it before owner_checked, and by the
    count-before-spend report''s coverage table, which gives it its own column and never counts it
    as a collection failure; press_render refuses such a row too, since there is no list to render.'

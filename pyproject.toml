[project]
name = "civic-ledger"
version = "0.0.0"
description = "Civic Alignment Platform — non-partisan legislative record ledger"
readme = "CONTRIBUTING.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27,<0.28",
    "tenacity>=9,<10",
    "PyYAML>=6,<7",
    "Flask>=3,<4",
]

[project.scripts]
ingest = "ingest.cli:main"
export = "ingest.export:main"
curate = "curation.cli:main"
checks = "ingest.checks.run:main"
archive-links = "ingest.checks.archive_links:main"
verify-recompute = "ingest.verify_recompute:main"
corrections = "ingest.corrections:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Two flat top-level packages both ship console scripts; declare explicitly
# so hatchling does not fail auto-discovery.
packages = ["ingest", "curation"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# §8 coverage gate. Enforced on the small, pure, credibility-bearing modules — the
# ones whose branches decide a published number. Coverage is NOT in `addopts` on
# purpose: a plain `uv run pytest` (or a single-file run) stays fast and usable; the
# 100%-branch GATE is a dedicated invocation (CI + the command in docs/PROGRESS.md):
#   uv run pytest --cov=ingest.metrics --cov=ingest.rankings \
#       --cov=ingest.scoring --cov=ingest.classify \
#       --cov-branch --cov-fail-under=100 --cov-report=term-missing
# Aggregate 100% over exactly these targets ⟺ each at 100%. V2-2 seeded the gate with
# metrics + rankings; V2-4 (D68) added scoring.py + classify.py (its live-fetch run()
# I/O now has tmp-repo/mock tests). Add a module here when it starts deciding a
# published evaluative number.
[tool.coverage.run]
branch = true

[tool.coverage.report]
# The module runner lines can never execute under pytest — the one legitimate,
# documented exclusion (§8 "listed, not silent"). Everything else is covered by a
# real test.
exclude_lines = [
    "if __name__ == .__main__.:",
]

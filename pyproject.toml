[project]
name = "civic-ledger"
version = "0.0.0"
description = "Civic Alignment Platform — non-partisan legislative record ledger"
readme = "CONTRIBUTING.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27,<0.28",
    "tenacity>=9,<10",
    "PyYAML>=6,<7",
    "Flask>=3,<4",
]

[project.scripts]
ingest = "ingest.cli:main"
export = "ingest.export:main"
curate = "curation.cli:main"
checks = "ingest.checks.run:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Two flat top-level packages both ship console scripts; declare explicitly
# so hatchling does not fail auto-discovery.
packages = ["ingest", "curation"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
